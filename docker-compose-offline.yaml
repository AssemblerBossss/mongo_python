services:
  mongo:
    hostname: mongo
    image: mongo:8
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: datasets
    volumes:
      - mongo_data:/data/db
      - ./datasets:/var/opt/mongo/datasets
    command: mongod --quiet --logpath /dev/null
    healthcheck:
      test: >
        timeout 8 mongosh localhost:27017/test --quiet
        --eval 'disableTelemetry(); db.runCommand({ping: 1}).ok' | grep -q 1
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 60s

  backend:
    image: assemblerbossss/mongo-python-backend:latest
    hostname: backend
    ports:
      - 8000:8000
    environment:
      APP_MONGO_HOST: mongo
      APP_MONGO_PORT: 27017
      APP_MONGO_USERNAME: admin
      APP_MONGO_PASSWORD: admin
      APP_MONGO_DB: datasets
      APP_CORS_ALLOW_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    image: assemblerbossss/mongo-python-frontend:latest
    hostname: frontend
    ports:
      - 3000:3000
    environment:
      BACKEND_API_ORIGIN: http://backend:8000
    depends_on:
      - backend

volumes:
  mongo_data:


