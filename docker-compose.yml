services:
  mongo:
    hostname: mongo
    image: mongo:8
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: datasets
    volumes:
      - mongo_data:/data/db
      - ./datasets:/var/opt/mongo/datasets
    command: mongod --quiet --logpath /dev/null
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    hostname: backend
    ports:
      - 8000:8000
    environment:
      APP_MONGO_HOST: mongo
      APP_MONGO_PORT: 27017
      APP_MONGO_USERNAME: admin
      APP_MONGO_PASSWORD: admin
      APP_MONGO_DB: datasets
      APP_CORS_ALLOW_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_API_ORIGIN: http://backend:8000
    hostname: frontend
    ports:
      - 3000:3000
    environment:
      BACKEND_API_ORIGIN: http://backend:8000
    depends_on:
      - backend

volumes:
  mongo_data:
